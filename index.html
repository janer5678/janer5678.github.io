<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Websites</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 80px 20px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 32px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li a {
      display: block;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      color: #111;
      font-size: 18px;
      text-decoration: none;
    }
    li a:hover { text-decoration: underline; }
    h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #999;
      margin: 40px 0 4px;
    }
    li a span {
      float: right;
      color: #999;
      font-size: 14px;
      line-height: 26px;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Websites</h1>

    <!--
      TO ADD A WEBSITE: copy the line below, paste it between <ul> and </ul>,
      and change the link and the name.

      <li><a href="https://example.com">Name of website</a></li>
    -->
    <h2>Games</h2>
    <ul>

      <li><a href="https://ms-paint-battle.netlify.app/">MS Paint Battle <span>Web game</span></a></li>
    </ul>

    <h2>Music</h2>
    <ul>
      <li><a href="https://soundcloud.com/janer567">janer567 <span>SoundCloud</span></a></li>
      <li><a href="https://soundcloud.com/kisanime">kisanime <span>SoundCloud</span></a></li>
    </ul>

    <h2>Instagram</h2>
    <ul>
      <li><a href="https://www.instagram.com/janerr567/">janerr567 <span>Instagram</span></a></li>
      <li><a href="https://www.instagram.com/kissanimebruh/">kissanimebruh <span>Instagram</span></a></li>
    </ul>
  </main>
</body>
</html>
